[project]
name = "tlsinspect"
version = "0.1.0"
description = "Connect to a host on TLS, fetch its certificate, and extract metadata + FQDNs."
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42.0",
    "dnspython>=2.6",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
tlsinspect = "tlsinspect.cli:app"
ptrlookup = "ptrlookup.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tlsinspect", "src/ptrlookup"]
